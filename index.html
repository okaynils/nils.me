<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--head-->
    <link rel="icon" type="image/png" href="/images/fern.png" />
    <link rel="alternate" type="application/rss+xml" title="Notes by Nils Fahrni" href="/feed.xml" />
    <script>
      // Set before first paint so a dark-mode visitor never sees a white flash.
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("theme") ??
          (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"><!--app--></div>
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
